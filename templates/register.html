{% extends "base.html" %}

{% block title %}Register - ShopZone{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-card">

        <div class="auth-logo">
            🛒
        </div>

        <h1>Create Account</h1>

        <p>Join ShopZone today.</p>


        {% if error %}

        <div class="error-message">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST">

            <label>Name</label>

            <input type="text"
                   name="name"
                   required>


            <label>Email</label>

            <input type="email"
                   name="email"
                   required>


            <label>Password</label>

            <input type="password"
                   name="password"
                   minlength="6"
                   required>


            <button class="auth-button">
                Register
            </button>

        </form>


        <p>
            Already have an account?
            <a href="{{ url_for('login') }}">
                Login
            </a>
        </p>

    </div>

</section>

{% endblock %}
