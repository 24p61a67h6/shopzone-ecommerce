{% extends "base.html" %}

{% block title %}Login - ShopZone{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-card">

        <div class="auth-logo">
            🛒
        </div>

        <h1>Welcome Back</h1>

        <p>Login to your ShopZone account.</p>


        {% if error %}

        <div class="error-message">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST">

            <label>Email</label>

            <input type="email"
                   name="email"
                   required>


            <label>Password</label>

            <input type="password"
                   name="password"
                   required>


            <button class="auth-button">
                Login
            </button>

        </form>


        <p>
            Don't have an account?
            <a href="{{ url_for('register') }}">
                Register
            </a>
        </p>

    </div>

</section>

{% endblock %}
